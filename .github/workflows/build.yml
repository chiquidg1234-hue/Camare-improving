name: LumaCam APK

on:
  push:
    branches: ["**"]
    # Cambios sólo de documentación no necesitan recompilar.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumacam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de la lógica pura (core)
        run: |
          chmod +x gradlew
          ./gradlew -p core test 2>&1 | tee core-test.log
          exit ${PIPESTATUS[0]}

      - name: Compilar APK de depuración
        run: |
          ./gradlew assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LumaCam-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Pruebas unitarias de la app
        run: |
          ./gradlew testDebugUnitTest 2>&1 | tee unit-test.log
          exit ${PIPESTATUS[0]}

      - name: Lint
        run: |
          ./gradlew lintDebug 2>&1 | tee lint.log
          exit ${PIPESTATUS[0]}

      - name: Mostrar informe de lint
        if: always()
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            head -300 app/build/reports/lint-results-debug.txt
          fi

      - name: Subir informes (lint y pruebas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/
            core/build/reports/
            *.log
          if-no-files-found: ignore

      - name: Resumen de errores
        if: failure()
        run: |
          for f in core-test.log build.log unit-test.log lint.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -E "^e: |^w: .*error|What went wrong|^> |FAILED|Error:|error:|Errors found" "$f" | head -80 || true
          done
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            echo "===== lint-results-debug.txt ====="
            head -150 app/build/reports/lint-results-debug.txt
          fi
